name: Flutter CI (scroll_spy)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_DIR: .

jobs:
  version-channel:
    name: Validate release lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version channel for target branch
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk -F': ' '/^version: /{print $2}' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "Unable to read version from pubspec.yaml."
            exit 1
          fi
          if [ "$TARGET_BRANCH" = "main" ] && [[ "$version" == *-* ]]; then
            echo "Main requires a stable version (no pre-release): $version"
            exit 1
          fi
          if [ "$TARGET_BRANCH" = "dev" ] && [[ "$version" != *-* ]]; then
            echo "Dev requires a pre-release version: $version"
            exit 1
          fi

  test:
    name: Test on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: minimum
            channel: stable
            version: '3.47.7'
          - name: stable
            channel: stable
            version: ''
          - name: beta
            channel: beta
            version: ''
    continue-on-error: ${{ matrix.name == 'beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        working-directory: ${{ env.PACKAGE_DIR }}
        run: flutter pub get
      - name: Install benchmark dependencies
        working-directory: benchmark
        run: flutter pub get
      - name: Check formatting
        working-directory: ${{ env.PACKAGE_DIR }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: ${{ env.PACKAGE_DIR }}
        run: flutter analyze
      - name: Run tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: flutter test
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Analyze example
        working-directory: example
        run: flutter analyze
      - name: Run example tests
        working-directory: example
        run: flutter test
      - name: Analyze benchmark
        working-directory: benchmark
        run: flutter analyze
      - name: Run comparison benchmark assertions
        working-directory: benchmark
        run: flutter test test/visibility_comparison_benchmark_test.dart

  ai-plugin:
    name: Validate AI plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Validate plugin manifests, skills, and version sync
        run: dart run tool/validate_ai_plugin.dart
