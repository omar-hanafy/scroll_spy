name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "example/**"
      - "tool/build_pages.sh"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "example/**"
      - "tool/build_pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # A project site is served from https://<user>.github.io/<repo>/, so every
  # absolute URL in the authored pages and the demo's compiled base href must
  # agree on this prefix. Leading and trailing slash are both required by
  # `flutter build web --base-href`.
  SITE_BASE: /scroll_spy/

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    concurrency:
      # A new commit supersedes an older build of the same pull request. Main
      # builds serialize so an older build cannot reach production after a
      # newer one.
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build and assemble the site
        # tool/build_pages.sh compiles example/ for the web and merges it with
        # the hand-authored website/ tree into build/pages/site. The same
        # script produces the same bundle locally, so a preview and a
        # deployment cannot drift apart.
        run: bash tool/build_pages.sh

      - name: Verify the demo's built base href
        # A wrong base href is the failure mode for project sites: the page
        # loads, then every asset 404s and the app never paints. Cheaper to
        # fail here than to discover it as a white screen in production.
        run: |
          actual=$(grep -o '<base href="[^"]*">' build/pages/site/demo/index.html || true)
          expected="<base href=\"${SITE_BASE}demo/\">"
          if [ "$actual" != "$expected" ]; then
            echo "Expected $expected but the build produced ${actual:-no base href tag}."
            exit 1
          fi
          echo "$actual"

      - name: Verify the authored landing page is present
        # The bundle is two independent halves. If the rsync of website/ were
        # dropped or aimed at the wrong path, the demo alone would still upload
        # and deploy cleanly, publishing a site with no landing page. MARKER is
        # a user-visible string that exists solely in the authored index.html;
        # update it if that copy changes.
        run: |
          MARKER="owns playback."
          if ! grep -qF "$MARKER" build/pages/site/index.html; then
            echo "Assembled index.html does not contain the landing-page marker: $MARKER"
            echo "Either website/index.html changed or the site half was not assembled."
            exit 1
          fi

      - name: Verify the showcase demo was built
        # Guards against the demo half being stale or replaced. This cannot be
        # checked against index.html: example/web/index.html is shared by every
        # entrypoint and leaves no trace of what was compiled. Only the output
        # differs, and only the JavaScript output carries readable string
        # literals - main.dart.wasm does not, so grep the .js half of the
        # --wasm build.
        run: |
          MARKER="Viewport-aware focus detection for scrollables"
          if ! grep -qF "$MARKER" build/pages/site/demo/main.dart.js; then
            echo "Built demo does not contain the showcase marker: $MARKER"
            echo "Either example/lib/main.dart is no longer the showcase, or the copy changed."
            exit 1
          fi

      - name: Verify no old site path survives
        # This site moved from /scroll-spy/ to /scroll_spy/. Any leftover
        # reference is a canonical tag, sitemap entry, or asset URL pointing at
        # a path that only serves a redirect stub, which is invisible in a
        # smoke test but corrodes search indexing.
        run: |
          if grep -rlF "/scroll-spy/" build/pages/site; then
            echo "The assembled site still references the retired /scroll-spy/ path."
            exit 1
          fi
          echo "No /scroll-spy/ references remain."

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        # `path` is resolved from the repository root regardless of any
        # working-directory default applied to the run steps above.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages/site

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests and manual dispatches from non-main branches build and
    # verify, but never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # GitHub Pages has one production target. Serialize every deployment
      # regardless of the triggering run or branch ref.
      group: pages-production
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
